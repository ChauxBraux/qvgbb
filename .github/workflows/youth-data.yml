name: Update youth schedule

# Pulls the youth league games and standings from GameChanger's public league
# pages and commits src/data/youth/gamechanger.json when anything changed.
# Each commit to main makes Vercel rebuild the site.
#
# If GameChanger can't be reached or sends back something that looks wrong,
# the script stops without changing the file, this run fails, and GitHub emails
# the repo owner. The site keeps showing the last good data.
#
# Times are UTC. The season (Nov to Jan) is all Eastern Standard Time (UTC-5).
on:
  schedule:
    - cron: '0 10 * * *'        # nightly, 5:00 AM ET
    - cron: '0,30 23 * * 1,3'   # Mon and Wed game nights, 6:00 and 6:30 PM ET
    - cron: '0,30 0-2 * * 2,4'  # 7:00 to 9:30 PM ET (already Tue/Thu in UTC)
    - cron: '0 3 * * 2,4'       # 10:00 PM ET
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: youth-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch GameChanger data
        run: node scripts/fetch-gamechanger.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/youth/gamechanger.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/youth/gamechanger.json
          git commit -m "Update youth schedule and standings from GameChanger"
          git push
